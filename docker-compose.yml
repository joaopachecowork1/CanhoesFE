services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: canhoes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canhoes}
      POSTGRES_USER: ${POSTGRES_USER:-canhoes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canhoes_local}
    ports:
      - "5433:5432"
    volumes:
      - canhoes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canhoes} -d ${POSTGRES_DB:-canhoes}"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canhoes-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Inside the compose network the database is the "postgres" service.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-canhoes}:${POSTGRES_PASSWORD:-canhoes_local}@postgres:5432/${POSTGRES_DB:-canhoes}?schema=public"
      # Let NextAuth build URLs from the forwarded host (needed behind the ngrok tunnel).
      AUTH_TRUST_HOST: "true"
    volumes:
      - canhoes_uploads:/app/.data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # Optional public URL: `docker compose --profile tunnel up` (needs NGROK_AUTHTOKEN).
  tunnel:
    image: docker.io/ngrok/ngrok:latest
    container_name: canhoes-tunnel
    profiles: ["tunnel"]
    restart: always
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=https://peloric-enola-browny.ngrok-free.dev"
      - "--log=stdout"
      - "web:3000"
    depends_on:
      - web

volumes:
  canhoes_postgres_data:
  canhoes_uploads:
